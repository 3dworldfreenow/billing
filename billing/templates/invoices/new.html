{% extends "base.html" %}
{% block title %}New invoice{% endblock %}
{% block content %}
<h1>New invoice</h1>
<form method="post" class="card">
  <label for="customer_id">Customer</label>
  <select id="customer_id" name="customer_id" required>
    <option value="">Choose…</option>
    {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
  </select>
  <div class="row">
    <div><label for="issue_date">Issue date</label><input id="issue_date" name="issue_date" type="date" value="{{ today }}"></div>
    <div><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" placeholder="30 days"></div>
    <div><label for="tax_rate">Tax rate (%)</label><input id="tax_rate" name="tax_rate" type="number" step="0.01" min="0" max="100" value="0"></div>
  </div>
  <label for="notes">Notes</label><textarea id="notes" name="notes" rows="2"></textarea>
  <p><button>Create invoice</button></p>
</form>
{% endblock %}
