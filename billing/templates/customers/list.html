{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="row"><h1>Customers</h1><a class="btn" href="{{ url_for('billing.customer_form') }}">New customer</a></div>
<div class="card">
  <table>
    <tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>
    {% for c in customers %}
    <tr><td>{{ c.name }}</td><td>{{ c.email or '' }}</td><td>{{ c.phone or '' }}</td>
        <td><a href="{{ url_for('billing.customer_form', customer_id=c.id) }}">Edit</a></td></tr>
    {% else %}
    <tr><td colspan="4">No customers yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
