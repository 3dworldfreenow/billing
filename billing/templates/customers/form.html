{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer.id else 'New' }} customer{% endblock %}
{% block content %}
<h1>{{ 'Edit' if customer.id else 'New' }} customer</h1>
<form method="post" class="card">
  <label for="name">Name</label><input id="name" name="name" value="{{ customer.name or '' }}" required>
  <label for="email">Email</label><input id="email" name="email" type="email" value="{{ customer.email or '' }}">
  <label for="phone">Phone</label><input id="phone" name="phone" value="{{ customer.phone or '' }}">
  <label for="address">Address</label><textarea id="address" name="address" rows="3">{{ customer.address or '' }}</textarea>
  <p><button>Save</button></p>
</form>
{% endblock %}
